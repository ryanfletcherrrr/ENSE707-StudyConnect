<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Study Group · AUT StudyConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="top-bar">
    <div class="top-bar__brand"><a href="dashboard.html">AUT StudyConnect</a></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </div>

  <main class="wide">
    <div class="card">
      <h1>Create a Study Group</h1>
      <p class="subtitle">Start a new group - you'll be added as its first member.</p>

      <div id="form-message" class="message" role="alert"></div>

      <form id="create-group-form" novalidate>
        <div class="field">
          <label for="group_name">Group name</label>
          <input type="text" id="group_name" name="group_name" placeholder="e.g. ENSE707 Thursday Study Group" aria-describedby="group_name-error" />
          <div class="field-error" id="group_name-error" data-error-for="group_name" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="course">Course</label>
          <input type="text" id="course" name="course" placeholder="e.g. ENSE707" aria-describedby="course-error" />
          <div class="field-error" id="course-error" data-error-for="course" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="What will this group focus on?" maxlength="1000" aria-describedby="description-error"></textarea>
          <div class="field-error" id="description-error" data-error-for="description" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="capacity">Capacity (2-20 members)</label>
          <input type="number" id="capacity" name="capacity" min="2" max="20" step="1" placeholder="6" aria-describedby="capacity-error" />
          <div class="field-error" id="capacity-error" data-error-for="capacity" aria-live="polite"></div>
        </div>

        <button type="submit" class="primary" id="submit-btn">Create group</button>
      </form>

      <p>
        <a href="search-groups.html">← Back to Study Groups</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/create-group.js"></script>
</body>
</html>
