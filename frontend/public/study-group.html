<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Group · AUT StudyConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="top-bar">
    <div class="top-bar__brand">
      <a href="dashboard.html">AUT StudyConnect</a>
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </div>

  <main class="wide">
    <div class="card">
      <h1 id="group-title">My Study Group</h1>

      <p id="group-message" class="subtitle">
        Loading study group...
      </p>

      <div id="group-details"></div>

      <button id="leave-group-btn" type="button">
        Leave Group
      </button>

    </div>

    <div class="card">
      <h2>Learning Resources</h2>
      <p class="subtitle">
        Share useful learning resources with members of this study group.
      </p>
    
      <form id="resource-form">
        <label for="resource-title">Title</label>
        <input
          id="resource-title"
          type="text"
          maxlength="200"
          required
        />
    
        <label for="resource-url">Resource URL</label>
        <input
          id="resource-url"
          type="url"
          placeholder="https://example.com"
          required
        />
    
        <label for="resource-description">Description (optional)</label>
        <textarea
          id="resource-description"
          maxlength="1000"
        ></textarea>
    
        <button type="submit">Share Resource</button>
      </form>
    
      <p id="resource-message" class="subtitle"></p>
    
      <h3>Shared Resources</h3>
      <div id="resource-list">
        <p>No resources shared yet.</p>
      </div>
    </div>



  </main>

  <script type="module" src="js/study-group.js"></script>
</body>
</html>
